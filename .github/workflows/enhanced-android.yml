name: Winlator Enhanced / Android

on:
  workflow_dispatch:
  push:
    branches:
      - feature/winlator-enhanced-profiles-11
      - feature/winlator-frame-pacing-cache-11
      - feature/fex-proton-runtime-integration-11
      - feature/launcher-proton-experience-11
      - feature/runtime-center-navigation-11
      - feature/minimal-runtime-manager-v2
    paths-ignore:
      - 'docs/**'
      - '**/README.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.editorconfig'
      - '.gitignore'
      - '.github/pull_request_template.md'
  pull_request:
    branches:
      - main
      - feature/winlator-enhanced-profiles-11
      - feature/winlator-frame-pacing-cache-11
      - feature/fex-proton-runtime-integration-11
      - feature/launcher-proton-experience-11

permissions:
  contents: read

# Keep only the newest APK build per branch/PR when multiple UI/docs commits land.
concurrency:
  group: winlator-enhanced-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify overlays and Java profile rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check exact upstream anchors
        run: python3 scripts/apply_app_overrides.py --check

      - name: Apply overlays twice (must be idempotent)
        run: |
          python3 scripts/apply_app_overrides.py
          python3 scripts/apply_app_overrides.py
          python3 scripts/apply_app_overrides.py --check

      - name: Compile and run pure Java profile regression tests
        run: |
          mkdir -p /tmp/winlator-profile-tests
          javac -encoding UTF-8 -d /tmp/winlator-profile-tests \
            overrides/app/src/main/java/com/winlator/optimization/ProfileRules.java \
            overrides/app/src/main/java/com/winlator/optimization/FrameTimeTracker.java \
            overrides/app/src/main/java/com/winlator/optimization/ConfigFilePolicy.java \
            overrides/app/src/main/java/com/winlator/optimization/FexWineRuntime.java \
            overrides/app/src/main/java/com/winlator/optimization/LibraryFilter.java \
            overrides/app/src/main/java/com/winlator/optimization/ProtonSyncRules.java \
            overrides/app/src/main/java/com/winlator/optimization/WineImportPolicy.java \
            tests/ProfileRulesTest.java \
            tests/FrameTimeTrackerTest.java \
            tests/FexWineRuntimeTest.java \
            tests/LibraryFilterTest.java \
            tests/ProtonSyncRulesTest.java \
            tests/WineImportPolicyTest.java
          java -ea -cp /tmp/winlator-profile-tests ProfileRulesTest
          java -ea -cp /tmp/winlator-profile-tests FrameTimeTrackerTest
          java -ea -cp /tmp/winlator-profile-tests FexWineRuntimeTest
          java -ea -cp /tmp/winlator-profile-tests LibraryFilterTest
          java -ea -cp /tmp/winlator-profile-tests ProtonSyncRulesTest
          java -ea -cp /tmp/winlator-profile-tests WineImportPolicyTest

      - name: Test Proton Wine archive conversion
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  apk:
    name: Build Android debug APK (experimental)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout with pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: app/gradle/wrapper/gradle-wrapper.properties

      - name: Locate Android SDK command-line tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found in Android SDK" >&2
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --list_installed | head -40

      - name: Install required SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Apply Winlator Enhanced sources
        run: python3 scripts/apply_app_overrides.py

      - name: Build debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK on success
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Enhanced-11-debug
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
